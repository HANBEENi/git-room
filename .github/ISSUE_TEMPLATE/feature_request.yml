name: ✨ 기능 제안
description: 새로운 기능이나 개선 아이디어
labels: ["type: feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제/니즈에서 나온 아이디어인가요?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 어디에 해당하나요?
      options:
        - web
        - mobile
        - shared
        - 기타
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려했던 다른 방법들 (선택)
    validations:
      required: false
